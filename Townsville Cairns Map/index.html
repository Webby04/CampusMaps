<html>
    <head>
        <title>JCU Maps App</title>
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>

        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    </head>
    <body>
        <div class="map-sidebar" id="map-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Map Filters</span>
                
                <button class="sidebar-button menu-button" id="menu-button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                
                <button class="sidebar-button close-button" id="close-button">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="sidebar-button campus-button">
                <i class="fa-solid fa-location-dot"></i>
                <span>Townsville</span>
            </button>

            <button class="sidebar-button campus-button">
                <i class="fa-solid fa-location-dot"></i>
                <span>Cairns</span>
            </button>

            <button class="sidebar-button settings-button">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

        <script src="script.js"></script>
    </body>
</html>
