<html>
    <head>
        <title>JCU Maps App</title>
        
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""/>

        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    </head>
    <body>
        <div class="map-sidebar" id="map-sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Map Filters</span>
                
                <button class="sidebar-button menu-button" id="menu-button" aria-label="Open map filters">
                    <i class="fa-solid fa-bars"></i>
                </button>

                
                <button class="sidebar-button close-button" id="close-button" aria-label="Close map filters">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <button class="sidebar-button campus-button" data-campus="tsv" aria-pressed="true">
                <i class="fa-solid fa-location-dot"></i>
                <span>Townsville</span>
            </button>

            <button class="sidebar-button campus-button" data-campus="cns" aria-pressed="false">
                <i class="fa-solid fa-location-dot"></i>
                <span>Cairns</span>
            </button>

            <div class="campus-filter">
                <h3>Campus</h3>

                <label class="campus-option">
                    <input type="radio" name="campus" value="tsv" checked>
                    <span class="radio-custom"></span>
                    <span>Townsville</span>
                </label>
                <label class="campus-option">
                    <input type="radio" name="campus" value="cns">
                    <span class="radio-custom"></span>
                    <span>Cairns</span>
                </label>

                <hr>
            </div>

            <div class="filter-menu">
                <div class="filter-header show-all-header">
                    <span class="filter-title">Show All</span>

                    <div class="filter-controls">
                        <button class="expand-button" id="showAllExpand" aria-label="Expand or collapse all filters" aria-expanded="false" aria-controls="filters">
                            <i class="fa-solid fa-chevron-down" id="showAllChevron"></i>
                        </button>

                        <label class="checkbox-container">
                            <input type="checkbox" id="showAllCheckbox" checked>
                            <span class="checkmark"></span>
                        </label>
                    </div>
                </div>

                <div id="filters" class="hidden">
                    <div class="filter-header parking-header">
                        <span class="filter-title">Parking</span>
                        <div class="filter-controls">
                            <button class="expand-button" id="parkingExpand" aria-label="Expand or collapse parking filters" aria-expanded="false" aria-controls="parkingFilters">
                                <i class="fa-solid fa-chevron-down" id="parkingChevron"></i>
                            </button>
                            <label class="checkbox-container">
                                <input type="checkbox" id="parkingCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>
                    </div>
                    <div id="parkingFilters" class="hidden">
                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-free"></i>
                                <span>Free Parking</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="freeParkingCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-freevpermit"></i>
                                <span>Free with vPermit</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="freevPermitCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-paid-all"></i>
                                <span>Paid All Day Parking</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="paidAllDayCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-paid-4hr"></i>
                                <span>Paid 4 Hour Max</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="paid4hrMaxCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-residential"></i>
                                <span>Residential Parking</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="residentialCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-cel-prem"></i>
                                <span>Premium Parking</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="premiumCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <i class="fa-solid fa-square-parking parking-special"></i>
                                <span>Special Parking</span>
                            </div>

                            <div class="filter-controls">
                                <button class="expand-button" id="specialParkingExpand" aria-label="Expand or collapse special parking filters" aria-expanded="false" aria-controls="specialParkingFilters">
                                    <i class="fa-solid fa-chevron-down" id="specialParkingChevron"></i>
                                </button>
                                <label class="checkbox-container">
                                    <input type="checkbox" id="specialParkingCheckbox" checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                        </div>

                        <div id="specialParkingFilters" class="special-parking-filters hidden">
                            <div class="special-parking-option">
                                <div class="parking-option-name">
                                    <span>Commercial</span>
                                </div>
                                <label class="checkbox-container">
                                    <input type="checkbox" id="commercialCheckbox" checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                            
                            <div class="special-parking-option">
                                <div class="parking-option-name">
                                    <span>Reserved</span>
                                </div>
                                <label class="checkbox-container">
                                    <input type="checkbox" id="reservedCheckbox" checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>

                            <div class="special-parking-option">
                                <div class="parking-option-name">
                                    <span>Loading</span>
                                </div>
                                <label class="checkbox-container">
                                    <input type="checkbox" id="loadingCheckbox" checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>

                            <div class="special-parking-option">
                                <div class="parking-option-name">
                                    <span>Visitor</span>
                                </div>
                                <label class="checkbox-container">
                                    <input type="checkbox" id="visitorCheckbox" checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>

                            <div class="special-parking-option">
                                <div class="parking-option-name">
                                    <span>Service</span>
                                </div>
                                <label class="checkbox-container">
                                    <input type="checkbox" id="serviceCheckbox" checked>
                                    <span class="checkmark"></span>
                                </label>
                            </div>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <span class="poi-icon poi-motorc parking-filter-poi-icon">
                                    <span class="material-symbols-outlined">motorcycle</span>
                                </span>
                                <span>Motorcycle</span>
                            </div>
                            <label class="checkbox-container">
                                <input type="checkbox" id="motorcycleCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>

                        <div class="parking-option">
                            <div class="parking-option-name">
                                <span class="poi-icon poi-accpark parking-filter-poi-icon">
                                    <i class="fa-solid fa-wheelchair"></i>
                                </span>
                                <span>Accessible Parking</span>
                            </div>
                            <label class="checkbox-container">
                                <input type="checkbox" id="accessibleCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-header show-on-map-header show-on-map-header">
                        <span class="filter-title">Show on the Map:</span>

                        <div class="filter-controls">
                            <button class="expand-button" id="showOnMapExpand" aria-label="Expand or collapse show on map filters" aria-expanded="false" aria-controls="showOnMapFilters">
                                <i class="fa-solid fa-chevron-down" id="showOnMapChevron"></i>    
                            </button>

                            <label class="checkbox-container">
                                <input type="checkbox" id="showOnMapCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>
                    </div>

                    <div id="showOnMapFilters" class="hidden">
                        <div class="show-on-the-map-option">
                            <div class="show-on-the-map-name">
                                <span class="poi-icon poi-trans parking-filter-poi-icon">
                                    <i class="fa-solid fa-bus-simple"></i>
                                </span>
                                <span>Bus Stops</span>
                            </div>

                            <label class="checkbox-container">
                                <input type="checkbox" id="transportCheckbox" checked>
                                <span class="checkmark"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <button class="sidebar-button settings-button" aria-label="Open map settings">
                <i class="fa-solid fa-gear"></i>
            </button> -->
        </div>
    
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

        <script src="js/map.js"></script>    
        <script src="js/parking.js"></script>
        <script src="js/poi.js"></script>
        <script src="js/filters.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
